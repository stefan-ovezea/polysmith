sonar.projectKey=polysmith
sonar.projectName=PolySmith
sonar.host.url=https://sonarqube.sovezea.org
sonar.sourceEncoding=UTF-8

# Only scan source code we own. Keep generated assets, build outputs,
# vendored dependencies, lockfiles, and packaged resources out of analysis.
sonar.sources=apps/desktop-ui/src,apps/desktop-ui/src-tauri/src,native/cad-core/src,native/cad-core/native_compat
sonar.tests=native/cad-core/tests
sonar.typescript.tsconfigPaths=apps/desktop-ui/tsconfig.json

# SonarOpenCommunity sonar-cxx plugin configuration.
# Do not use sonar.cfamily.* here; that belongs to SonarSource CFamily.
sonar.cxx.file.suffixes=.c,.cc,.cxx,.cpp,.h,.hh,.hpp
sonar.cxx.jsonCompilationDatabase=native/cad-core/build/compile_commands.json
sonar.cxx.jsonCompilationDatabase.analyzeOnlyContainedFiles=true

sonar.inclusions=**/*.ts,**/*.tsx,**/*.d.ts,**/*.rs,**/*.cpp,**/*.cxx,**/*.cc,**/*.c,**/*.h,**/*.hpp,**/*.hh,**/*.css
sonar.test.inclusions=**/*_test.cpp,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/build-release/**,\
  **/target/**,\
  **/third_party/**,\
  **/src-tauri/gen/**,\
  **/src-tauri/icons/**,\
  **/src-tauri/resources/**,\
  **/public/**,\
  **/assets/**,\
  **/*.lock,\
  **/*.polysmith,\
  **/.DS_Store
